name: Run Idealista Daily Stats

on:
  schedule:
    - cron: '30 7 * * *'  # Запуск каждый день в 07:30 UTC (через полчаса после Fotocasa)
  workflow_dispatch:      # Возможность запустить вручную из интерфейса GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl playwright
          playwright install chromium

      - name: Run Idealista script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
        run: |
          python idealista_stats.py
